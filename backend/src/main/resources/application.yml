spring:
  application:
    name: restrictions
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=restriction_registry;trustServerCertificate=true;encrypt=false
    username: sa
    password: StrongPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/restriction-registry
          jwk-set-uri: http://127.0.0.1:8085/realms/restriction-registry/protocol/openid-connect/certs

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
